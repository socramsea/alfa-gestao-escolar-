name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: alfa
          POSTGRES_PASSWORD: alfa_dev_password
          POSTGRES_DB: alfa_gestao_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U alfa -d alfa_gestao_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://alfa:alfa_dev_password@localhost:5432/alfa_gestao_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

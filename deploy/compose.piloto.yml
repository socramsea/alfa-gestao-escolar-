services:
  postgres:
    restart: "no"
  api:
    restart: "no"
    environment:
      # Numa reunião pelo túnel (deploy/piloto/tunel.sh), quem está no mesmo Wi-Fi chega com o mesmo
      # endereço público e divide o limite por visitante. Por isso o teto da API é maior no piloto.
      PUBLIC_LEADS_PER_WINDOW: "200"
      FAMILY_REQUESTS_PER_WINDOW: "600"
  frontend:
    restart: "no"

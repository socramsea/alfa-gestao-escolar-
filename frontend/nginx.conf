limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=public_leads:10m rate=6r/m;
limit_req_zone $binary_remote_addr zone=family:10m rate=20r/m;
server {
    listen 8080;
    server_tokens off;
    # Os limites contam por visitante. A porta só é publicada em 127.0.0.1, então só o próprio servidor
    # chega aqui: o proxy HTTPS (Caddy) ou o túnel (cloudflared), pelo gateway da rede do Docker, que é
    # um endereço privado. Esses proxies escrevem o IP do visitante no X-Forwarded-For. Com recursive,
    # vale o último endereço não confiável da lista, o que o proxy escreveu; o que o visitante puser
    # antes é ignorado. Sem isso, todos os visitantes seriam um endereço só, e um cliente sozinho
    # esgotaria o limite de login de todos.
    set_real_ip_from 127.0.0.0/8;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 2m;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    location = /api/auth/login {
        limit_req zone=login burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Pré-matrícula pública: limite por IP antes da API, que aplica o próprio limite.
    location ~ ^/api/public/sites/[a-z0-9-]+/leads$ {
        limit_req zone=public_leads burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    # Matrícula online da família: limite por IP antes da API; o banco bloqueia o link após 5 datas erradas.
    location ~ ^/api/family/enrollments/(access|submissions)$ {
        limit_req zone=family burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /api/ {
        proxy_pass http://api:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
    location /assets/ { try_files $uri =404; expires 1y; }
    location / { try_files $uri $uri/ /index.html; }
}
